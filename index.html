<body>
<header class="top">
  <div class="hero-img" id="heroImg"></div>
  <div class="wrap">
    <div class="brand">
      <h1>Residencial Boa Esperança</h1>
      <p id="brandSub">Gestão de aluguéis • 15 kitnets • Cuiabá/MT</p>
    </div>
    <div class="row"><nav class="tabs" id="tabs"></nav><div id="who" class="row tiny" style="color:#fff;opacity:.9"></div></div>
  </div>
</header>
<main class="wrap" id="app"><div class="card center muted">Carregando…</div></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = (n) => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const r2 = (n) => Math.round(Number(n || 0) * 100) / 100;
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const br = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return d ? `${d}/${m}/${y}` : `${m}/${y}`; };
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const monthLabel = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MESES[m - 1]}/${y}`; };
const todayD = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const monthKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const nextMonth = (mk) => { const [y, m] = mk.split('-').map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; };
const onlyDigits = (s) => String(s || '').replace(/\D/g, '');
const waLink = (phone, text) => { let d = onlyDigits(phone); if (d && !d.startsWith('55')) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; };
const firstName = (n) => String(n || '').trim().split(/\s+/)[0] || '';

function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  $('#toastRoot').replaceChildren(el); setTimeout(() => el.remove(), 3500);
}
async function copyText(text, msg = 'Copiado!') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { openModal('Copiar', `<p class="small muted">Selecione e copie o texto abaixo:</p><textarea class="i mono" rows="6" readonly>${esc(text)}</textarea>`); }
}

/* ============ PIX (BR Code do Banco Central) ============ */
const pixTxt = (t, max) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 ]/g, '').toUpperCase().trim().slice(0, max);
function pixKeyNorm(key, type) {
  const raw = String(key || '').trim();
  if (type === 'Celular') { const d = onlyDigits(raw); return d.startsWith('55') && d.length >= 12 ? '+' + d : '+55' + d; }
  if (type === 'CPF/CNPJ') return onlyDigits(raw);
  if (type === 'E-mail') return raw.toLowerCase();
  return raw;
}
function crc16(p) { let c = 0xffff; for (let i = 0; i < p.length; i++) { c ^= p.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) { c = c & 0x8000 ? (c << 1) ^ 0x1021 : c << 1; c &= 0xffff; } } return c.toString(16).toUpperCase().padStart(4, '0'); }
const emv = (id, v) => `${id}${pad(v.length)}${v}`;
function pixPayload(cfg, amount, txid) {
  const ma = emv('00', 'br.gov.bcb.pix') + emv('01', pixKeyNorm(cfg.pixKey, cfg.pixType));
  const tx = pixTxt(txid, 25).replace(/ /g, '') || '***';
  const p = emv('00', '01') + emv('26', ma) + emv('52', '0000') + emv('53', '986') + emv('54', Number(amount).toFixed(2)) +
    emv('58', 'BR') + emv('59', pixTxt(cfg.pixHolder, 25) || 'RESIDENCIAL') + emv('60', 'CUIABA') + emv('62', emv('05', tx)) + '6304';
  return p + crc16(p);
}

const DEFAULT_CFG = {
  pixKey: '65992225780', pixType: 'Celular', pixHolder: 'Sonia Maria Zanutto da Silva', whatsAdmin: '65 99216-4498', finePct: 2, interestMonthPct: 1,
  trackingStart: monthKey(new Date()), reviewUrl: 'https://search.google.com/local/writereview?placeid=ChIJQbNh5wexnZMR71EdzmAvilE',

};
const baseValue = (u) => r2(Number(u.rent || 0) + (u.hasGarage ? Number(u.garageFee || 0) : 0));
function dueDateFor(u, mk) {
  const [y, m] = mk.split('-').map(Number); const last = new Date(y, m, 0).getDate();
  return new Date(y, m - 1, Math.min(Number(u.dueDay || 10), last));
}
function amountFor(u, due, payDate, cfg) {
  const base = baseValue(u); const late = Math.max(0, daysBetween(due, payDate));
  if (late <= 0) return { base, fine: 0, interest: 0, total: base, late: 0 };
  const fine = r2(base * Number(cfg.finePct || 0) / 100);
  const interest = r2(base * Number(cfg.interestMonthPct || 0) / 100 / 30 * late);
  return { base, fine, interest, total: r2(base + fine + interest), late };
}
/* Lista os meses cobráveis da kitnet e a situação de cada um */
function chargesFor(u, cfg) {
  if (!u || u.status !== 'occupied' || !u.contractStart) return [];
  const today = todayD(); const cur = monthKey(today);
  let mk = [String(u.contractStart).slice(0, 7), cfg.trackingStart || cur].sort()[1];
  const out = []; let guard = 0;
  while (mk <= cur && guard++ < 60) {
    const due = dueDateFor(u, mk);
    const paid = (u.payments || []).find(p => p.month === mk && p.status === 'paid');
    if (paid) out.push({ month: mk, due, status: 'paid', payment: paid });
    else {
      const a = amountFor(u, due, today, cfg);
      const dleft = daysBetween(today, due);
      out.push({ month: mk, due, status: dleft < 0 ? 'overdue' : (dleft <= 3 ? 'soon' : 'pending'), daysLeft: dleft, amount: a });
    }
    mk = nextMonth(mk);
  }
  return out;
}
function unitState(u, cfg) {
  if (!u || u.status !== 'occupied') return { key: 'vacant', open: [], charges: [] };
  if (baseValue(u) <= 0) return { key: 'exempt', open: [], charges: [] };
  const charges = chargesFor(u, cfg); const open = charges.filter(c => c.status !== 'paid');
  let key = 'paid';
  if (open.some(c => c.status === 'overdue')) key = 'overdue';
  else if (open.some(c => c.status === 'soon')) key = 'soon';
  else if (open.length) key = 'pending';
  return { key, open, charges };
}
const contractDaysLeft = (u) => u.contractEnd ? daysBetween(todayD(), parseYmd(u.contractEnd)) : null;
function statusPill(key, extra = '') {
  const m = { exempt: ['p-paid', 'Isento'], paid: ['p-paid', 'Em dia'], overdue: ['p-over', 'Em atraso'], soon: ['p-soon', 'Vence em breve'], pending: ['p-pend', 'A vencer'], vacant: ['p-vac', 'Vaga'] }[key];
  return `<span class="pill ${m[0]}">${m[1]}${extra ? ' ' + esc(extra) : ''}</span>`;
}

function actionRow(a) {
  const u = a.u; const cfg = S.cfg; let left = '', right = '';
  const who = `<strong>Kitnet ${esc(u.number)}</strong> — ${esc(u.tenantName || 'sem nome')}`;
  if (a.kind === 'overdue') {
    left = `${statusPill('overdue', `há ${-a.o.daysLeft} dia(s)`)} ${who}<div class="small muted">${monthLabel(a.o.month)} • venceu ${br(ymd(a.o.due))} • hoje ${brl(a.o.amount.total)}</div>`;
    right = `<a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waLink(u.phone, msgFor('overdue', u, cfg, a.o)))}">Cobrar no WhatsApp</a><button class="btn sm" data-open="${esc(u.id)}" data-tab="pagamentos">Registrar pagamento</button>`;
  } else if (a.kind === 'soon') {
    left = `${statusPill('soon', a.o.daysLeft === 0 ? 'hoje' : `em ${a.o.daysLeft} dia(s)`)} ${who}<div class="small muted">${monthLabel(a.o.month)} • vence ${br(ymd(a.o.due))} • ${brl(a.o.amount.total)}</div>`;
    right = `<a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waLink(u.phone, msgFor('reminder', u, cfg, a.o)))}">Enviar lembrete</a><button class="btn sm" data-open="${esc(u.id)}" data-tab="pagamentos">Registrar pagamento</button>`;
  } else if (a.kind === 'ticket') {
    left = `<span class="pill ${a.t.urgent ? 'p-over' : 'p-soon'}">🔧 Manutenção${a.t.urgent ? ' urgente' : ''}</span> ${who}<div class="small muted">${esc(a.t.category)} • ${esc(String(a.t.text || '').slice(0, 80))}${String(a.t.text || '').length > 80 ? '…' : ''}</div>`;
    right = `<a class="btn sm pri" href="#manutencao">Ver pedido</a>`;
  } else if (a.kind === 'signed') {
    left = `<span class="pill p-paid">Contrato assinado</span> ${who}<div class="small muted">Enviou a renovação assinada pelo gov.br — confira e aprove</div>`;
    right = `<button class="btn pri sm" data-open="${esc(u.id)}" data-tab="digital">Conferir e aprovar</button>`;
  } else if (a.kind === 'renewal') {
    left = `<span class="pill p-soon">Contrato</span> ${who}<div class="small muted">${a.cd < 0 ? 'terminou em' : 'termina em'} ${br(u.contractEnd)}${a.cd >= 0 ? ` (${a.cd} dias)` : ''}</div>`;
    right = `<a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waLink(u.phone, msgFor('renewal', u, cfg)))}">Perguntar sobre renovação</a><button class="btn sm" data-open="${esc(u.id)}" data-tab="digital">Renovação digital</button>`;
  } else {
    left = `<span class="pill p-pend">Acesso</span> ${who}<div class="small muted">Sem e-mail de acesso ao Portal do Inquilino</div>`;
    right = `<button class="btn sm" data-open="${esc(u.id)}">Cadastrar e-mail</button>`;
  }
  return `<div class="it"><div>${left}</div><div class="row">${right}</div></div>`;
}

/* ---------- Arquivos PDF guardados no Firestore (em pedaços) ---------- */
const CHUNK = 700000, MAX_PDF = 8 * 1024 * 1024;
function fileToB64(file) { return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = bad; r.readAsDataURL(file); }); }
async function uploadPdf(file, meta) {
  if (!file) throw new Error('Escolha um arquivo PDF.');
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) throw new Error('O arquivo precisa ser PDF.');
  if (file.size > MAX_PDF) throw new Error('PDF muito grande (máximo 8 MB).');
  const b64 = await fileToB64(file); const n = Math.ceil(b64.length / CHUNK);
  const ref = S.db.collection('files').doc();
  await ref.set({ ...meta, name: file.name.slice(0, 120), size: file.size, chunks: n, by: S.me, createdAt: new Date().toISOString() });

/* Conferência automática do contrato assinado:
   1) o arquivo assinado começa exatamente com o PDF enviado (o gov.br só acrescenta a assinatura no fim)
   2) existe uma assinatura digital nova no arquivo
   3) o certificado da assinatura traz o nome do inquilino */

  (S1.slice(prefix ? n : 0).match(/\/Contents\s*<([0-9A-Fa-f\s]+)>/g) || []).forEach(m => {
    const hex = m.replace(/^\/Contents\s*</, '').replace(/[>\s]/g, '');
    const bytes = new Uint8Array(hex.length / 2); for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);

  const name = parts.length >= 2 && certTxt.includes(parts[0]) && certTxt.includes(parts[parts.length - 1]);

          for (let i = 0; i < tkNew.length; i++) await ref.collection('photos').doc(String(i)).set({ d: tkNew[i] });
          const cfg = S.cfg; e.target.remove(); toast('Pedido enviado! A administração foi avisada.'); renderTickets(false);
          if (cfg.whatsAdmin) { const box = document.createElement('div'); box.className = 'notice n-ok row between'; box.innerHTML = `<span>Pedido registrado ✅ Quer avisar também pelo WhatsApp?</span><a class="btn wa sm" target="_blank" rel="noopener" href="${esc(waLink(cfg.whatsAdmin, `Olá! Abri um pedido de manutenção da Kitnet ${p.number} (${f.get('cat')}) no portal: ${text.slice(0, 200)}`))}">Avisar no WhatsApp</a>`; $('#app .stack').insertBefore(box, $('#tkForm')); }
        } catch (er) { toast('Não foi possível enviar. Tente de novo.'); b.disabled = false; b.textContent = 'Enviar pedido'; }
      };
    }
    $('#tkList').innerHTML = list.length ? list.map(t => ticketCard(t, false)).join('') : `<p class="small muted" style="margin:0">Você ainda não abriu nenhum pedido.</p>`;
  }
  (S.tickets || []).forEach(t => { const box = document.getElementById('ph-' + t.id); if (box) loadPhotos(t, box); });
}

/* Grava a kitnet e atualiza o portal do inquilino vinculado */
/* Leva para a ficha da kitnet o contrato assinado que o inquilino enviou pelo portal */
let syncing = false;
async function syncSigned() {
  if (syncing || !S.portals) return; syncing = true;
  try { for (const u of Object.values(S.units)) {
    const p = S.portals[emailKey(u.email)]; const r = u.renewal, pr = p && p.renewal;
    if (r && r.status === 'sent' && pr && pr.status === 'signed' && pr.draftId === r.draftId && pr.signedId) {
      const nr = { ...r, status: 'signed', signedId: pr.signedId, signedName: pr.signedName || '', signedAt: pr.signedAt || '', check: pr.check || null, autoOk: !!pr.autoOk };
      // assinatura conferida pelo sistema: aprova sozinho, sem ninguém clicar
      if (nr.autoOk) await saveUnit(u, { contractStart: r.newStart, contractEnd: r.newEnd, rent: r.newRent ?? u.rent, contractFileId: nr.signedId, contractFileName: nr.signedName, renewal: { ...nr, status: 'done', approvedAt: new Date().toISOString(), approvedBy: 'automático' } });
      else await S.db.doc('units/' + u.id).update({ renewal: nr });
    }
  } } catch (e) {} finally { syncing = false; }
}
async function saveUnit(u, patch) {
  try {
    const ref = S.db.doc('units/' + u.id);
    await ref.update(patch);
    const snap = await ref.get(); const next = snap.exists ? snap.data() : { ...u, ...patch };
    const oldKey = emailKey(u.email), newKey = next.status === 'occupied' ? emailKey(next.email) : '';
    if (oldKey && oldKey !== newKey) await S.db.doc('portal/' + oldKey).delete();
    if (newKey) {
      await S.db.doc('portal/' + newKey).set({
        unitId: u.id, number: next.number, tenantName: next.tenantName, cpf: next.cpf, status: 'occupied',
        rent: next.rent, hasGarage: !!next.hasGarage, garageFee: next.garageFee, dueDay: next.dueDay,
        contractStart: next.contractStart, contractEnd: next.contractEnd, contractUrl: next.contractUrl || '', wifiName: next.wifiName || '', wifiPass: next.wifiPass || '', energyUC: next.energyUC || '', contractFileId: next.contractFileId || '', contractFileName: next.contractFileName || '', renewal: next.renewal || null, payments: next.payments || [], asaas: next.asaas || {}, updatedAt: new Date().toISOString()
      });
    }
  } catch (e) { toast(e && e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido.' : 'Não foi possível salvar. Tente de novo.'); throw e; }
}

    : `<p style="margin:0">Só o dono (${esc(OWNER_EMAIL)}) pode adicionar ou remover administradores.</p>`}

/* ---------- Portal do Inquilino ---------- */
function renderTenant() {
  document.body.classList.remove('is-login');
  const app = $('#app');
  if (!S.loaded) { app.innerHTML = `<div class="card center muted">Carregando seu portal…</div>`; return; }
  const cfg = S.cfg;
  if (!S.portal) {
    const t = `Olá! Sou inquilino(a) do Residencial Boa Esperança e não consigo ver minha kitnet no Portal do Inquilino. Entrei com o e-mail ${S.me}. Minha kitnet é a nº `;
    app.innerHTML = `<div class="card stack" style="max-width:640px;margin:0 auto">
      <h2>Bem-vindo(a) ao Portal do Inquilino</h2>
      <p class="muted" style="margin:0">O e-mail <b>${esc(S.me)}</b> ainda não está cadastrado em nenhuma kitnet. Confira se entrou com o mesmo e-mail que passou para a administração ou avise a gente.</p>
      <div class="row">${cfg.whatsAdmin ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(cfg.whatsAdmin, t))}">Avisar a administração pelo WhatsApp</a>` : ''}<button class="btn" id="swAcc">Entrar com outro e-mail</button></div>
      ${cfg.whatsAdmin ? `<div class="tiny muted">WhatsApp da administração: ${esc(cfg.whatsAdmin)}</div>` : ''}
    </div>`;
    $('#swAcc').onclick = () => S.auth.signOut();
    return;
  }
  const u = { ...S.portal, id: S.portal.unitId };
  const st = unitState(u, cfg); const today = todayD(); const cd = contractDaysLeft(u);
  const start = parseYmd(u.contractStart), end = parseYmd(u.contractEnd);
  const prog = start && end ? Math.max(0, Math.min(100, Math.round((today - start) / (end - start) * 100))) : 0;
  const next = st.open.find(o => o.status === 'overdue') || st.open[0];
  const paid = (u.payments || []).filter(p => p.status === 'paid').sort((a, b) => b.month.localeCompare(a.month));
  const az = next && u.asaas && u.asaas[next.month] && !u.asaas[next.month].paid ? u.asaas[next.month] : null;
  const pix = az && az.pix ? az.pix : next && cfg.pixKey ? pixPayload(cfg, next.amount.total, `K${u.number}${next.month.replace('-', '')}`) : '';
  const avisar = next ? `Olá! Aqui é ${firstName(u.tenantName)}, da Kitnet ${u.number}. Paguei o aluguel de ${monthLabel(next.month)} (${brl(next.amount.total)}). Segue o comprovante.` : '';

  app.innerHTML = `<div class="stack">
    <div class="cover" style="background-image:url('${photoUrl(1)}')"><div class="in"><div class="row between" style="align-items:flex-end"><div><div class="small" style="opacity:.85">Olá, ${esc(firstName(u.tenantName))} 👋</div><h2>Kitnet ${esc(u.number)}</h2>
      <div class="small" style="opacity:.9">${st.key === 'exempt' ? 'isento de aluguel' : `vencimento todo dia ${pad(u.dueDay)} • ${brl(baseValue(u))}/mês`}${u.hasGarage ? ' (com garagem)' : ''}</div></div>${statusPill(st.key)}</div></div></div>
    ${renewalTenantCard(u)}
    <div class="grid g2">
      <div class="card stack ${next && next.status !== 'overdue' ? 'pay-card' : ''}">
        <h2>${next ? (next.status === 'overdue' ? 'Aluguel em atraso' : 'Próximo aluguel') : 'Pagamentos'}</h2>
        ${next ? `
          <div><div class="big" style="color:${next.status === 'overdue' ? 'var(--red)' : 'var(--ink)'}">${brl(next.amount.total)}</div>
          <div class="small muted">${monthLabel(next.month)} • vence ${br(ymd(next.due))}${next.status === 'overdue' ? ` • ${next.amount.late} dia(s) de atraso` : next.daysLeft === 0 ? ' • vence hoje' : ` • faltam ${next.daysLeft} dia(s)`}</div>
          ${next.amount.late ? `<div class="small" style="margin-top:4px">Aluguel ${brl(next.amount.base)} + multa ${brl(next.amount.fine)} + juros ${brl(next.amount.interest)}</div>` : ''}</div>
          ${pix ? `<div><label class="f">PIX Copia e Cola (valor já incluso)</label><textarea class="i mono" rows="3" readonly>${esc(pix)}</textarea>
              <div class="row" style="margin-top:6px"><button class="btn pri" id="cpPix">Copiar código PIX</button></div>
              ${az ? `<div class="tiny muted" style="margin-top:4px">✅ Pagou por este código? A baixa é automática — o recibo aparece aqui em instantes, não precisa mandar comprovante.</div>${az.invoiceUrl ? `<a class="btn sm" style="margin-top:6px" target="_blank" rel="noopener" href="${esc(az.invoiceUrl)}">Abrir fatura (QR Code)</a>` : ''}` : `<div class="tiny muted" style="margin-top:4px">Chave ${esc(cfg.pixType)}: ${esc(cfg.pixKey)} • Titular: ${esc(cfg.pixHolder)}</div>`}</div>` : ''}
          ${cfg.whatsAdmin && !az ? `<a class="btn wa" target="_blank" rel="noopener" href="${esc(waLink(cfg.whatsAdmin, avisar))}">Já paguei — enviar comprovante</a>` : ''}
          ${st.open.length > 1 ? `<div class="notice n-warn small">Você tem ${st.open.length} mensalidades em aberto: ${st.open.map(o => monthLabel(o.month)).join(', ')}.</div>` : ''}
        ` : st.key === 'exempt' ? `<div class="notice n-ok">Você está isento de aluguel. Não há nada a pagar. ✅</div>` : `<div class="notice n-ok">Tudo em dia! Obrigado. ✅</div>`}
      </div>
      <div class="card stack">
        <h2>Meu contrato</h2>
        <div class="grid g2"><div><div class="tiny muted">Início</div><b>${br(u.contractStart)}</b></div><div><div class="tiny muted">Término</div><b>${br(u.contractEnd)}</b></div></div>
        <div><div class="bar"><i style="width:${prog}%"></i></div><div class="tiny muted" style="margin-top:4px">${cd === null ? '' : cd >= 0 ? `Faltam ${cd} dias para o término` : 'Prazo do contrato encerrado — fale com a administração sobre a renovação'}</div></div>
        ${u.contractFileId ? `<button class="btn" id="dlContract">Baixar contrato assinado (PDF)</button>` : u.contractUrl ? `<a class="btn" target="_blank" rel="noopener" href="${esc(u.contractUrl)}">Abrir contrato assinado (PDF)</a>` : `<p class="small muted" style="margin:0">O PDF do contrato ainda não foi anexado pela administração.</p>`}
        <p class="tiny muted" style="margin:0">Água e internet inclusas pelo contrato. A energia elétrica é individual.</p>
      </div>
    </div>
    ${u.wifiName || u.wifiPass || u.energyUC ? `<div class="card">
      <h2>Minha kitnet</h2>
      <div class="grid g3">
        ${u.wifiName ? `<div><div class="tiny muted">Rede Wi-Fi</div><b>${esc(u.wifiName)}</b></div>` : ''}
        ${u.wifiPass ? `<div><div class="tiny muted">Senha do Wi-Fi</div><div class="row"><b class="mono" style="font-size:14px">${esc(u.wifiPass)}</b><button class="btn sm" id="cpWifi">Copiar</button></div></div>` : ''}
        ${u.energyUC ? `<div><div class="tiny muted">UC de energia (conta de luz)</div><div class="row"><b class="mono" style="font-size:14px">${esc(u.energyUC)}</b><button class="btn sm" id="cpUC">Copiar</button></div></div>` : ''}
      </div>
      ${u.energyUC ? `<div class="tiny muted" style="margin-top:8px">A energia é individual: use este número para consultar ou pagar a conta de luz da sua kitnet.</div>` : ''}
    </div>` : ''}
    <div class="card">
      <h2>Histórico e recibos</h2>
      ${paid.length ? `<div class="list">${paid.map(p => `<div class="it"><div><b>${monthLabel(p.month)}</b> — ${brl(p.amount)}<div class="small muted">Pago em ${br(p.paidDate)} • Recibo ${esc(p.receiptNo)}</div></div>
        <div class="row"><button class="btn sm" data-rv="${esc(p.receiptNo)}">Ver</button><button class="btn sm pri" data-rd="${esc(p.receiptNo)}">Baixar PDF</button></div></div>`).join('')}</div>` : `<p class="small muted">Os recibos aparecem aqui assim que a administração registra cada pagamento.</p>`}
    </div>
    ${cfg.reviewUrl ? `<div class="card row between"><div><b>Gosta de morar aqui?</b><div class="small muted">Sua avaliação no Google ajuda outros estudantes a nos encontrar.</div></div><a class="btn terra" target="_blank" rel="noopener" href="${esc(cfg.reviewUrl)}">Avaliar no Google</a></div>` : ''}
  </div>`;
  const dc = $('#dlContract'); if (dc) dc.onclick = () => downloadFile(u.contractFileId, u.contractFileName || 'contrato.pdf');
  bindRenewalTenant(u);
  const cp = $('#cpPix'); if (cp) cp.onclick = () => copyText(pix, 'Código PIX copiado. Cole no app do seu banco.');
  const cw = $('#cpWifi'); if (cw) cw.onclick = () => copyText(u.wifiPass, 'Senha do Wi-Fi copiada');
  const cu = $('#cpUC'); if (cu) cu.onclick = () => copyText(u.energyUC, 'UC de energia copiada');
  app.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => openReceipt(u, paid.find(p => p.receiptNo === b.dataset.rv), cfg));
  app.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => downloadReceipt(u, paid.find(p => p.receiptNo === b.dataset.rd), cfg));
}

init();
